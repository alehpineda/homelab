        alloy_http_listen_addr: "{{ ansible_host }}:12345"  # metrics wave 1
        alloy_source_journal: true
        alloy_journal_job: grafana_journal
        alloy_apt_existing_grafana_repo: true  # keep the existing apt.grafana.com source/key
        alloy_service_label: grafana
        alloy_ct_label: "171"

- name: Alloy on CT 172 (Prometheus journal, wave 1)
  hosts: prometheus-blr-lxc
  gather_facts: false
  tags: [alloy_prometheus, alloy_wave1]
  roles:
