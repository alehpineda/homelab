---
# Loki CT 173 + OpenObserve CT 177 side by side, fed the same logs by
# Grafana Alloy. Not imported by site.yml. Run one phase at a time with
# --tags, only from an approved plan:
#   loki          CT 173 config (30d retention, no bogus Alertmanager URL)
#   openobserve   CT 177 install (needs ~/.config/forge/openobserve_{root,ingest})
#   alloy_host    BRL host journald  -> Loki + OpenObserve
#   alloy_caddy   CT 250 access log  -> Loki + OpenObserve (Caddyfile log block first)
#   alloy_arr     CT 182 Docker logs -> Loki + OpenObserve
#   prom_rw       CT 172 Prometheus remote_write -> OpenObserve
#   o2_node_exporter  CT 177 prometheus-node-exporter (mp0 disk metric)
#   prom_scrape   CT 172 repo-managed scrape jobs (scrape.d + scrape_config_files)
#   alloy_wave1   wave 1 journald on CT 171/172/173/174/177/184 (per-CT tags:
#                 alloy_grafana, alloy_prometheus, alloy_pve_exporter,
#                 alloy_kuma, alloy_loki, alloy_openobserve). Apply one CT at
#                 a time in that order, never all six at once. Needs the
#                 log_shippers ipset (PR #71) live first.
#                 Wave 1 never runs --tags alloy_host (BRL is already live).
#   alloy_wave2   wave 2 journald on CT 180/183/185/186/187/193/196/160/161/181/188
#                 (per-CT tags alloy_<service>). One CT at a time; ipset first.
#   alloy_wave3   wave 3 journald on CT 170/169/197/164/175/162/189/194/195/199
#                 (per-CT tags alloy_<service>). One CT at a time; ipset first.
#                 CT 182 (alloy_arr) adds the qBittorrent log file and the
#                 Dockge JSON pack in the same wave.
# See docs/runbooks/logging-loki-openobserve.md.
- name: Loki config
  hosts: loki-blr-lxc
  gather_facts: false
  tags: [loki]
  roles:
    - role: loki_config

- name: OpenObserve
  hosts: openobserve-blr-lxc
  gather_facts: false
  tags: [openobserve]
  roles:
    - role: openobserve

- name: Alloy on the BRL host (journald)
  hosts: barbatoslupusrex
  gather_facts: false
  tags: [alloy_host]
  roles:
    - role: alloy
      vars:
        # Metrics wave 1. Applied by the owner-run root script
        # plans/brl-alloy-lan-listener-20261114.sh (grokops has no sudo; never
        # run --tags alloy_host for this). Host fw: tcp/12345 from 10.10.0.72.
        alloy_http_listen_addr: "10.10.0.21:12345"
        alloy_source_journal: true

- name: Alloy on CT 250 (Caddy access log)
  hosts: caddy-blr-lxc
  gather_facts: false
  tags: [alloy_caddy]
  roles:
    - role: alloy
      vars:
        alloy_http_listen_addr: "{{ ansible_host }}:12345"  # metrics wave 1
        alloy_source_caddy: true

- name: Alloy on CT 182 (Docker)
  hosts: arr-blr-lxc
  gather_facts: false
  tags: [alloy_arr]
  roles:
    - role: alloy
      vars:
        alloy_http_listen_addr: "{{ ansible_host }}:12345"  # metrics wave 1
        alloy_source_docker: true
        # Standard JSON body for the text-console containers; CLEF Servarr
        # lines stay untouched, only their banner/NLog text lines are packed.
        # Dockge is packed too (wave 3); qBittorrent logs to a file (below).
        alloy_docker_json_containers: [bazarr, jackett, flaresolverr, gluetun, recyclarr, watchtower, listenarr, dockge]
        alloy_docker_banner_containers: [prowlarr, sonarr, radarr, lidarr]
        # Wave 3 (owner card t57s331, 5:41 PM CT Nov 14): qBittorrent log file
        # -> job arr_qbittorrent (labels job/host/ct/service/env).
        alloy_source_qbittorrent: true
        alloy_ct_label: "182"

- name: node_exporter on CT 177 (OpenObserve mp0 /opt/openobserve/data disk usage)
  hosts: openobserve-blr-lxc
  gather_facts: false
  tags: [o2_node_exporter]
  roles:
    - role: node_exporter

- name: Prometheus scrape jobs (repo-managed)
  hosts: prometheus-blr-lxc
  gather_facts: false
  tags: [prom_scrape]
  roles:
    - role: prometheus_scrape
      vars:
        # Metrics wave 1 (owner card t40s246, 2:45 PM CT Nov 14) plus wave 2
        # (Wolff 1:1 5:14 PM CT Nov 14): jellyfin, navidrome, searxng; wave 3
        # (card t57s331, 5:41 PM CT Nov 14): exportarr x5, cadvisor, n8n.
        # One target at a time on apply (-e prometheus_scrape_jobs=<subset>);
        # this is the end state.
        prometheus_scrape_jobs:
          - job: openobserve_node
            static_configs:
              - targets: ["10.10.0.77:9100"]
                labels: {host: openobserve-blr-lxc, ct: "177", service: node_exporter, env: homelab}
          - job: openobserve
            static_configs:
              - targets: ["10.10.0.77:5080"]
                labels: {host: openobserve-blr-lxc, ct: "177", service: openobserve, env: homelab}
          - job: loki
            static_configs:
              - targets: ["10.10.0.73:3100"]
                labels: {host: loki-blr-lxc, ct: "173", service: loki, env: homelab}
          - job: grafana
            static_configs:
              - targets: ["10.10.0.71:3000"]
                labels: {host: grafana-blr-lxc, ct: "171", service: grafana, env: homelab}
          - job: alloy
            static_configs:
              - targets: ["10.10.0.71:12345"]
                labels: {host: grafana-blr-lxc, ct: "171", service: alloy, env: homelab}
              - targets: ["10.10.0.72:12345"]
                labels: {host: prometheus-blr-lxc, ct: "172", service: alloy, env: homelab}
              - targets: ["10.10.0.73:12345"]
                labels: {host: loki-blr-lxc, ct: "173", service: alloy, env: homelab}
              - targets: ["10.10.0.74:12345"]
                labels: {host: pve-exporter-blr-lxc, ct: "174", service: alloy, env: homelab}
              - targets: ["10.10.0.77:12345"]
                labels: {host: openobserve-blr-lxc, ct: "177", service: alloy, env: homelab}
              - targets: ["10.10.0.84:12345"]
                labels: {host: uptimekuma-blr-lxc, ct: "184", service: alloy, env: homelab}
              - targets: ["10.10.0.250:12345"]
                labels: {host: caddy-blr-lxc, ct: "250", service: alloy, env: homelab}
              - targets: ["10.10.0.82:12345"]
                labels: {host: arr-blr-lxc, ct: "182", service: alloy, env: homelab}
              - targets: ["10.10.0.21:12345"]
                labels: {host: barbatoslupusrex, ct: "host", service: alloy, env: homelab}
          - job: kuma
            # Basic auth: any username + a dedicated Kuma API key (owner-created
            # 2026-11-14). The key file lives only on CT172 (0600 root:root).
            # Prometheus itself runs as root; there is no prometheus user on CT172.
            basic_auth: {username: prometheus, password_file: /etc/prometheus/kuma_api_key}
            static_configs:
              - targets: ["10.10.0.84:3001"]
                labels: {host: uptimekuma-blr-lxc, ct: "184", service: uptime-kuma, env: homelab}
          - job: caddy
            static_configs:
              - targets: ["10.10.0.250:9180"]
                labels: {host: caddy-blr-lxc, ct: "250", service: caddy, env: homelab}
          # Metrics wave 2 (owner yes in Wolff 1:1, 5:14 PM CT Nov 14).
          - job: jellyfin
            static_configs:
              - targets: ["10.10.0.80:8096"]
                labels: {host: jellyfin-blr-lxc, ct: "180", service: jellyfin, env: homelab}
          - job: navidrome
            static_configs:
              - targets: ["10.10.0.86:4533"]
                labels: {host: navidrome-blr-lxc, ct: "186", service: navidrome, env: homelab}
          - job: searxng
            # Basic auth: any username + general.open_metrics (password file
            # lives only on CT172, 0600 root:root; not in git).
            basic_auth: {username: prometheus, password_file: /etc/prometheus/searxng_metrics_pass}
            static_configs:
              - targets: ["10.10.0.60:8888"]
                labels: {host: searxng-blr-lxc, ct: "160", service: searxng, env: homelab}
          # Metrics wave 3 (owner card t57s331, 5:41 PM CT Nov 14). exportarr
          # containers on CT182 (keys: /opt/stacks/arr/secrets, 0600 root).
          - job: exportarr-sonarr
            static_configs:
              - targets: ["10.10.0.82:9707"]
                labels: {host: arr-blr-lxc, ct: "182", service: sonarr, env: homelab}
          - job: exportarr-radarr
            static_configs:
              - targets: ["10.10.0.82:9708"]
                labels: {host: arr-blr-lxc, ct: "182", service: radarr, env: homelab}
          - job: exportarr-lidarr
            static_configs:
              - targets: ["10.10.0.82:9709"]
                labels: {host: arr-blr-lxc, ct: "182", service: lidarr, env: homelab}
          - job: exportarr-prowlarr
            static_configs:
              - targets: ["10.10.0.82:9710"]
                labels: {host: arr-blr-lxc, ct: "182", service: prowlarr, env: homelab}
          - job: exportarr-bazarr
            # Bazarr's episode-subtitle walk takes tens of seconds.
            scrape_interval: 120s
            scrape_timeout: 90s
            static_configs:
              - targets: ["10.10.0.82:9711"]
                labels: {host: arr-blr-lxc, ct: "182", service: bazarr, env: homelab}
          - job: cadvisor
            # docker_only on the cAdvisor side; drop any container_* series
            # that is not a named Docker container (cgroup noise).
            metric_relabel_configs:
              - {source_labels: [__name__, name], regex: "container_.*;", action: drop}
            static_configs:
              - targets: ["10.10.0.82:8080"]
                labels: {host: arr-blr-lxc, ct: "182", service: cadvisor, env: homelab}
          - job: n8n
            static_configs:
              - targets: ["10.10.0.70:5678"]
                labels: {host: n8n-blr-lxc, ct: "170", service: n8n, env: homelab}

