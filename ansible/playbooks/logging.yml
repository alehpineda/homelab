        alloy_source_journal: true
        alloy_journal_job: pve_exporter_journal
        alloy_service_label: pve_exporter
        alloy_ct_label: "174"

- name: Alloy on CT 184 (Uptime Kuma journal, wave 1)
  hosts: uptimekuma-blr-lxc
  gather_facts: false
  tags: [alloy_kuma, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_http_listen_addr: "{{ ansible_host }}:12345"  # metrics wave 1
        alloy_source_journal: true
        alloy_journal_job: kuma_journal
        alloy_service_label: kuma
        alloy_ct_label: "184"
        # Drop the prom-client "is not included in initial labelset" error
        # and its ~15-line stack (upstream louislam/uptime-kuma#6470, ~2.2k
        # lines/min). Only these exact frames; other Kuma lines ship as-is.
        alloy_journal_drop_rules:
          - reason: kuma_labelset
            comment: "Kuma prom-client labelset error header (uptime-kuma#6470)."
            expression: '(PROMETHEUS.*ERROR:.*Caught error\s*$|Error: Added label "[^"]*" is not included in initial labelset)'
          - reason: kuma_labelset
            comment: "Kuma labelset error: label-name list lines and closing bracket."
            expression: "^(\\s+'(monitor_(id|name|type|url|hostname|port)|window)',?|\\])$"
          - reason: kuma_labelset
            comment: "Kuma labelset error: prom-client / prometheus.js / monitor.js stack frames."
            expression: '^\s+at ([^ ]+ )+\(/opt/uptime-kuma/(node_modules/prom-client/lib/|server/prometheus\.js:)|^\s+at (beat|async safeBeat|Proxy\.handleTlsInfo|async TLSSocket\.<anonymous>|Proxy\.stop) \(/opt/uptime-kuma/server/model/monitor\.js:'

- name: Alloy on CT 173 (Loki journal, wave 1)
  hosts: loki-blr-lxc
  gather_facts: false
  tags: [alloy_loki, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_http_listen_addr: "{{ ansible_host }}:12345"  # metrics wave 1
        alloy_source_journal: true
        alloy_journal_job: loki_journal
        alloy_apt_existing_grafana_repo: true  # keep the existing apt.grafana.com source/key
        alloy_service_label: loki
        alloy_ct_label: "173"
        # Wave 6 (card t72s425, 10:42 PM CT Nov 14): remote syslog from the
        # Flint router (OpenWrt logd, RFC3164 over UDP). Comet KVM has no
        # remote-syslog setting, so it has no listener.
        alloy_source_syslog: true
        alloy_syslog_listeners:
          - {address: "10.10.0.73:1514", protocol: udp, format: rfc3164,
             job: flint_syslog, host: flint, service: flint}
        alloy_syslog_drop_rules:
          - reason: secret_token_shape
            comment: "Tokens, JWTs, private key headers (same as the wave 3 guard)."
            expression: '(hvs\.[A-Za-z0-9_-]{20,}|\bs\.[A-Za-z0-9]{24}\b|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY)'
          - reason: secret_password_kv
            comment: "password=/passwd=/psk= key-value pairs (hostapd, PPPoE, VPN logs)."
            expression: "(?i)\\b(password|passwd|psk|wpa_passphrase|secret)\\s*[=:]\\s*\\S+"

