        # Wave 3 secret guard (journal scan 5:57 PM CT Nov 14: postiz/netbox
        # install logs carry a literal SQL role password). Drop, never ship,
        # any line with a SQL PASSWORD literal or a token/key shape. Same
        # list on every wave 3 CT (YAML anchor).
        alloy_journal_drop_rules: &w3_secret_drops
          - reason: secret_sql_password
            comment: "SQL role password literal (CREATE/ALTER ROLE ... PASSWORD '...')."
            expression: "(?i)\\bPASSWORD\\s+'[^']+'"
          - reason: secret_token_shape
            comment: "OpenBao/Vault tokens, JWTs, private key headers."
            expression: '(hvs\.[A-Za-z0-9_-]{20,}|\bs\.[A-Za-z0-9]{24}\b|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY)'

