---
# Loki CT 173 + OpenObserve CT 177 side by side, fed the same logs by
# Grafana Alloy. Not imported by site.yml. Run one phase at a time with
# --tags, only from an approved plan:
#   loki          CT 173 config (30d retention, no bogus Alertmanager URL)
#   openobserve   CT 177 install (needs ~/.config/forge/openobserve_{root,ingest})
#   alloy_host    BRL host journald  -> Loki + OpenObserve
#   alloy_caddy   CT 250 access log  -> Loki + OpenObserve (Caddyfile log block first)
#   alloy_arr     CT 182 Docker logs -> Loki + OpenObserve
#   prom_rw       CT 172 Prometheus remote_write -> OpenObserve
#   alloy_wave1   wave 1 journald on CT 171/172/173/174/177/184 (per-CT tags:
#                 alloy_grafana, alloy_prometheus, alloy_pve_exporter,
#                 alloy_kuma, alloy_loki, alloy_openobserve). Apply one CT at
#                 a time in that order, never all six at once. Needs the
#                 log_shippers ipset (PR #71) live first.
#                 Wave 1 never runs --tags alloy_host (BRL is already live).
# See docs/runbooks/logging-loki-openobserve.md.
- name: Loki config
  hosts: loki-blr-lxc
  gather_facts: false
  tags: [loki]
  roles:
    - role: loki_config

- name: OpenObserve
  hosts: openobserve-blr-lxc
  gather_facts: false
  tags: [openobserve]
  roles:
    - role: openobserve

- name: Alloy on the BRL host (journald)
  hosts: barbatoslupusrex
  gather_facts: false
  tags: [alloy_host]
  roles:
    - role: alloy
      vars:
        alloy_source_journal: true

- name: Alloy on CT 250 (Caddy access log)
  hosts: caddy-blr-lxc
  gather_facts: false
  tags: [alloy_caddy]
  roles:
    - role: alloy
      vars:
        alloy_source_caddy: true

- name: Alloy on CT 182 (Docker)
  hosts: arr-blr-lxc
  gather_facts: false
  tags: [alloy_arr]
  roles:
    - role: alloy
      vars:
        alloy_source_docker: true

- name: Prometheus remote_write to OpenObserve
  hosts: prometheus-blr-lxc
  gather_facts: false
  tags: [prom_rw]
  roles:
    - role: prometheus_remote_write

- name: Alloy on CT 171 (Grafana journal, wave 1)
  hosts: grafana-blr-lxc
  gather_facts: false
  tags: [alloy_grafana, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_source_journal: true
        alloy_journal_job: grafana_journal
        alloy_apt_existing_grafana_repo: true  # keep the existing apt.grafana.com source/key
        alloy_service_label: grafana
        alloy_ct_label: "171"

- name: Alloy on CT 172 (Prometheus journal, wave 1)
  hosts: prometheus-blr-lxc
  gather_facts: false
  tags: [alloy_prometheus, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_source_journal: true
        alloy_journal_job: prometheus_journal
        alloy_service_label: prometheus
        alloy_ct_label: "172"

- name: Alloy on CT 174 (PVE exporter journal, wave 1)
  hosts: pve-exporter-blr-lxc
  gather_facts: false
  tags: [alloy_pve_exporter, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_source_journal: true
        alloy_journal_job: pve_exporter_journal
        alloy_service_label: pve_exporter
        alloy_ct_label: "174"

- name: Alloy on CT 184 (Uptime Kuma journal, wave 1)
  hosts: uptimekuma-blr-lxc
  gather_facts: false
  tags: [alloy_kuma, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_source_journal: true
        alloy_journal_job: kuma_journal
        alloy_service_label: kuma
        alloy_ct_label: "184"
        # Drop the prom-client "is not included in initial labelset" error
        # and its ~15-line stack (upstream louislam/uptime-kuma#6470, ~2.2k
        # lines/min). Only these exact frames; other Kuma lines ship as-is.
        alloy_journal_drop_rules:
          - reason: kuma_labelset
            comment: "Kuma prom-client labelset error header (uptime-kuma#6470)."
            expression: '(PROMETHEUS.*ERROR:.*Caught error\s*$|Error: Added label "[^"]*" is not included in initial labelset)'
          - reason: kuma_labelset
            comment: "Kuma labelset error: label-name list lines and closing bracket."
            expression: "^(\\s+'(monitor_(id|name|type|url|hostname|port)|window)',?|\\])$"
          - reason: kuma_labelset
            comment: "Kuma labelset error: prom-client / prometheus.js / monitor.js stack frames."
            expression: '^\s+at ([^ ]+ )+\(/opt/uptime-kuma/(node_modules/prom-client/lib/|server/prometheus\.js:)|^\s+at (beat|async safeBeat|Proxy\.handleTlsInfo|async TLSSocket\.<anonymous>|Proxy\.stop) \(/opt/uptime-kuma/server/model/monitor\.js:'

- name: Alloy on CT 173 (Loki journal, wave 1)
  hosts: loki-blr-lxc
  gather_facts: false
  tags: [alloy_loki, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_source_journal: true
        alloy_journal_job: loki_journal
        alloy_apt_existing_grafana_repo: true  # keep the existing apt.grafana.com source/key
        alloy_service_label: loki
        alloy_ct_label: "173"

- name: Alloy on CT 177 (OpenObserve journal, wave 1)
  hosts: openobserve-blr-lxc
  gather_facts: false
  tags: [alloy_openobserve, alloy_wave1]
  roles:
    - role: alloy
      vars:
        alloy_source_journal: true
        alloy_journal_job: openobserve_journal
        alloy_service_label: openobserve
        alloy_ct_label: "177"
