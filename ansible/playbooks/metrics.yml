---
# Enable native Prometheus metrics on wave 2 apps (Jellyfin, Navidrome, SearXNG)
# and wave 3 (n8n, --tags metrics_n8n; OpenBao telemetry, --tags metrics_openbao).
# Owner yes: Wolff 1:1, 5:14 PM CT Nov 14 2026.
#
#   cd ansible && ansible-playbook -i <inv> playbooks/metrics.yml --tags metrics_jellyfin
#   ... --tags metrics_navidrome
#   ... --tags metrics_searxng -e searxng_metrics_pass_file=/path/to/pass
#
# Each play backs up the guest config (once, *.bak-forge-metrics) and restarts
# the app only if the setting changed. Apply one CT at a time. The SearXNG
# password is never committed and is not logged.

- name: Enable Jellyfin Prometheus metrics
  hosts: jellyfin-blr-lxc
  gather_facts: false
  tags: [metrics_jellyfin]
  vars:
    jellyfin_system_xml: /etc/jellyfin/system.xml
  tasks:
    - name: Confirm EnableMetrics exists once
      ansible.builtin.command:
        argv: [grep, -c, -E, "<EnableMetrics>(true|false)</EnableMetrics>", "{{ jellyfin_system_xml }}"]
      register: _jf_tag
      changed_when: false
      failed_when: (_jf_tag.stdout | int) != 1

    - name: Read EnableMetrics
      ansible.builtin.command:
        argv: [grep, -oE, "<EnableMetrics>(true|false)</EnableMetrics>", "{{ jellyfin_system_xml }}"]
      register: _jf_cur
      changed_when: false

    - name: Backup system.xml
      ansible.builtin.copy:
        src: "{{ jellyfin_system_xml }}"
        dest: "{{ jellyfin_system_xml }}.bak-forge-metrics"
        remote_src: true
        owner: jellyfin
        group: adm
        mode: "0644"
        force: false
      when: _jf_cur.stdout == '<EnableMetrics>false</EnableMetrics>'

    - name: Set EnableMetrics to true
      ansible.builtin.replace:
        path: "{{ jellyfin_system_xml }}"
        regexp: '<EnableMetrics>false</EnableMetrics>'
        replace: '<EnableMetrics>true</EnableMetrics>'
      notify: Restart jellyfin
  handlers:
    - name: Restart jellyfin
      ansible.builtin.systemd_service:
        name: jellyfin
        state: restarted

- name: Enable Navidrome Prometheus metrics
  hosts: navidrome-blr-lxc
  gather_facts: false
  tags: [metrics_navidrome]
  vars:
    navidrome_toml: /etc/navidrome/navidrome.toml
  tasks:
    - name: Backup navidrome.toml
      ansible.builtin.copy:
        src: "{{ navidrome_toml }}"
        dest: "{{ navidrome_toml }}.bak-forge-metrics"
        remote_src: true
        owner: navidrome
        group: navidrome
        mode: "0644"
        force: false

    - name: Ensure Prometheus.Enabled = true
      ansible.builtin.blockinfile:
        path: "{{ navidrome_toml }}"
        marker: "# {mark} FORGE Prometheus metrics"
        block: |
          [Prometheus]
          Enabled = true
        insertafter: EOF
        owner: navidrome
        group: navidrome
        mode: "0644"
      notify: Restart navidrome
  handlers:
    - name: Restart navidrome
      ansible.builtin.systemd_service:
        name: navidrome
        state: restarted

- name: Enable SearXNG open metrics
  hosts: searxng-blr-lxc
  gather_facts: false
  tags: [metrics_searxng]
  vars:
    searxng_settings: /etc/searxng/settings.yml
    # Controller path to the open_metrics password (0600). Never commit it.
    searxng_metrics_pass_file: ""
  tasks:
    - name: Require searxng_metrics_pass_file
      ansible.builtin.assert:
        that:
          - searxng_metrics_pass_file | length > 0
        fail_msg: "Set -e searxng_metrics_pass_file=/path (0600, not in git)."

    - name: Password file must exist on the controller
      ansible.builtin.stat:
        path: "{{ searxng_metrics_pass_file }}"
      delegate_to: localhost
      become: false
      register: _sx_pass

    - name: Fail if the password file is missing
      ansible.builtin.assert:
        that:
          - _sx_pass.stat.exists
          - _sx_pass.stat.size > 0
        fail_msg: "searxng_metrics_pass_file is missing or empty on the controller."

    - name: Backup settings.yml
      ansible.builtin.copy:
        src: "{{ searxng_settings }}"
        dest: "{{ searxng_settings }}.bak-forge-metrics"
        remote_src: true
        owner: searxng
        group: searxng
        mode: "0640"
        force: false

    - name: Install the settings editor
      ansible.builtin.copy:
        src: set_searxng_open_metrics.py
        dest: /root/forge-set-searxng-open-metrics.py
        owner: root
        group: root
        mode: "0700"

    - name: Stage the password on the guest (0600 root)
      ansible.builtin.copy:
        src: "{{ searxng_metrics_pass_file }}"
        dest: /root/forge-searxng-metrics.pass
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Apply open metrics settings
      ansible.builtin.command:
        argv:
          - python3
          - /root/forge-set-searxng-open-metrics.py
          - "{{ searxng_settings }}"
          - /root/forge-searxng-metrics.pass
      register: _sx_edit
      no_log: true
      changed_when: _sx_edit.rc == 0 and (_sx_edit.stdout | default('') | trim) == 'changed'
      failed_when: _sx_edit.rc != 0
      notify: Restart searxng

    - name: Shred the staged password and editor
      ansible.builtin.command:
        argv:
          - shred
          - -u
          - /root/forge-searxng-metrics.pass
          - /root/forge-set-searxng-open-metrics.py
      changed_when: false
  handlers:
    - name: Restart searxng
      ansible.builtin.systemd_service:
        name: searxng
        state: restarted

# Metrics wave 3 (owner card t57s331, 5:41 PM CT Nov 14 2026): n8n native
# /metrics on 10.10.0.70:5678 (PVE fw: from Prometheus .72 only, plus the
# existing Caddy/nb_routers UI rules). /opt/n8n.env holds secrets: the play
# only adds one line and never prints the file.
- name: Enable n8n Prometheus metrics
  hosts: n8n-blr-lxc
  gather_facts: false
  tags: [metrics_n8n]
  vars:
    n8n_env_file: /opt/n8n.env
  tasks:
    - name: Backup n8n.env
      ansible.builtin.copy:
        src: "{{ n8n_env_file }}"
        dest: "{{ n8n_env_file }}.bak-forge-metrics"
        remote_src: true
        owner: root
        group: root
        mode: "0640"
        force: false
      no_log: true

    - name: Set N8N_METRICS=true
      ansible.builtin.lineinfile:
        path: "{{ n8n_env_file }}"
        regexp: '^N8N_METRICS='
        line: N8N_METRICS=true
        owner: root
        group: root
        mode: "0640"
      notify: Restart n8n
  handlers:
    - name: Restart n8n
      ansible.builtin.systemd_service:
        name: n8n
        state: restarted

# Metrics wave 3 (owner card t872s4598, 7:31 PM CT Nov 14 2026): OpenBao
# telemetry retention so /v1/sys/metrics?format=prometheus has samples.
# Does not enable unauthenticated_metrics_access; Prometheus scrapes with
# a read-only token (policy prometheus-metrics, issued once with the root
# token). Restart only if the block is added or changed. Auto-unseal is
# ExecStartPost in the unit drop-in.
- name: Enable OpenBao Prometheus telemetry
  hosts: openbao
  gather_facts: false
  tags: [metrics_openbao]
  vars:
    openbao_hcl: /etc/openbao/openbao.hcl
  tasks:
    - name: Backup openbao.hcl
      ansible.builtin.copy:
        src: "{{ openbao_hcl }}"
        dest: "{{ openbao_hcl }}.bak-forge-metrics"
        remote_src: true
        owner: openbao
        group: openbao
        mode: "0644"
        force: false

    - name: Stage a copy for the telemetry edit
      ansible.builtin.copy:
        src: "{{ openbao_hcl }}"
        dest: /root/openbao.hcl.forge-metrics
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    - name: Ensure telemetry prometheus_retention_time on the staging copy
      ansible.builtin.blockinfile:
        path: /root/openbao.hcl.forge-metrics
        marker: "# {mark} FORGE Prometheus telemetry"
        block: |
          telemetry {
            prometheus_retention_time = "24h"
          }
        insertafter: EOF

    - name: Validate the staging copy
      ansible.builtin.command:
        argv: [bao, operator, validate-config, "-config=/root/openbao.hcl.forge-metrics"]
      changed_when: false

    - name: Install openbao.hcl if the staging copy differs
      ansible.builtin.copy:
        src: /root/openbao.hcl.forge-metrics
        dest: "{{ openbao_hcl }}"
        remote_src: true
        owner: openbao
        group: openbao
        mode: "0644"
      notify: Restart openbao

    - name: Remove the staging copy
      ansible.builtin.file:
        path: /root/openbao.hcl.forge-metrics
        state: absent
  handlers:
    - name: Restart openbao
      ansible.builtin.systemd_service:
        name: openbao
        state: restarted
