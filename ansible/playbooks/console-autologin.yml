---
# Opt-in console root autologin for CT 175 and CT 250 only.
# site.yml does not import this file. Running it is a separate approval
# and is not granted by opening the pull request.
- name: Console root autologin on opted-in guests
  hosts: console_autologin
  gather_facts: false
  become: true
  roles:
    - role: console_autologin
      vars:
        console_autologin_enabled: true
