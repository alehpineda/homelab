---
# Single source of truth for BRL guest inbound allowlists.
# Wave 1 LIVE 2026-11-09 18:52-19:01 CT on 164,175,172,173,174,180,181,182,183
#   (PR #37). Wave 2 LIVE 2026-11-09 19:41-20:00 CT on 153-156,160-162,165,
#   169-171,176,154,155,250.
# Plan: Forge plans/2026-11-09-pve-guest-firewall.md.

pve_fw_cluster_ipsets:
  caddy:
    comment: Caddy eth0/eth1
    cidrs: [10.10.0.250, 10.10.0.251]
  nb_routers:
    comment: NetBird routing peers (masquerade)
    cidrs: [10.10.0.50, 10.10.0.51]
  log_shippers:
    # Wave 1 (2026-11-14): + Grafana .71, Prometheus .72, Loki .73, PVE exporter .74,
    # OpenObserve .77, Uptime Kuma .84 (LAN IP, not NetBird). .73/.77 push to each
    # other over eth0; self-push is loopback and never hits the PVE firewall.
    # Used only by CT173 IN tcp/3100 and CT177 IN tcp/5080.
    comment: Grafana Alloy agents (BRL host, Caddy CT250, arr CT182, wave 1-5 CTs, PBS host); AdGuard .53/.55 querylog
    # Wave 2 (2026-11-14): + journald on 180,183,185,186,187,193,196,160,161,181,188.
    # AdGuard querylog (2026-11-14): + .55 (B), .53 (A).
    # Wave 3 (2026-11-14, card t57s331): + journald on 170,169,197,164,175(.63),162,189,194,195,199.
    # Wave 4 (2026-11-14, card t64s378): + journald on 191,176,165 (192/198 removed 2026-11-17). Logs only.
    # Wave 5 (2026-11-14, card t67s400): + journald on 151,150,154,156 (.53/.55 already in).
    # Wave 6 (2026-11-14, card t72s425): + PBS host .25 journald (bare metal, no guest fw).
    # Databases (2026-11-16, t927u/t928u): + journald on 178 (.78), 179 (.79). Inert until the CTs exist.
    # GitLab (2026-11-20, t994s5195): + Alloy on 166 (.66).
    cidrs: [10.10.0.21, 10.10.0.250, 10.10.0.82, 10.10.0.71, 10.10.0.72, 10.10.0.73, 10.10.0.74, 10.10.0.77, 10.10.0.84,
            10.10.0.80, 10.10.0.83, 10.10.0.85, 10.10.0.86, 10.10.0.87, 10.10.0.93, 10.10.0.96, 10.10.0.60, 10.10.0.61, 10.10.0.81, 10.10.0.88,
            10.10.0.55, 10.10.0.53,
            10.10.0.70, 10.10.0.69, 10.10.0.97, 10.10.0.64, 10.10.0.63, 10.10.0.62, 10.10.0.89, 10.10.0.94, 10.10.0.95, 10.10.0.99,
            10.10.0.91, 10.10.0.76, 10.10.0.65,
            10.10.0.51, 10.10.0.50, 10.10.0.54, 10.10.0.56,
            10.10.0.25,
            10.10.0.78, 10.10.0.79, 10.10.0.66]
  # `management` already exists (10.10.0.0/24, 100.85.0.0/16) and is used by
  # node rules for 22/8006/3128. Not managed here; change it only with NetTit.

pve_fw_cluster_aliases:
  grafana: 10.10.0.71
  prometheus: 10.10.0.72
  loki: 10.10.0.73
  openobserve: 10.10.0.77
  firecrawl: 10.10.0.64
  n8n: 10.10.0.70
  seerr: 10.10.0.83
  adguard_a: 10.10.0.53
  adguard_b: 10.10.0.55
  adguardsync: 10.10.0.56
  unbound: 10.10.0.54
  flint: 10.10.0.1

# Security group attached to every rolled-out CT.
pve_fw_group_ct_base:
  - {action: ACCEPT, macro: SSH, source: +management, comment: SSH from management}
  - {action: ACCEPT, proto: icmp, comment: icmp}

pve_fw_ct_options:
  enable: 1
  policy_in: DROP
  policy_out: ACCEPT
  ipfilter: 1
  log_level_in: nolog

# Per-CT guest ipsets (created before options). CT250 needs a custom
# ipfilter-net0 holding both .250 and .251 so replies sourced from .251 that
# leave via eth0/net0 are not dropped by anti-spoof.
pve_fw_ct_ipsets:
  250:
    ipfilter-net0:
      comment: "caddy eth0+eth1 IPs (anti-spoof for .251 via net0)"
      cidrs: [10.10.0.250, 10.10.0.251]

# Extra IN ACCEPT rules per VMID (after GROUP ct_base). source omitted = any.
# Empty list = ct_base only (SSH + icmp).
pve_fw_ct_rules:
  # --- wave 1 (live) ---
  164:  # firecrawl (NetBird peer)
    - {proto: tcp, dport: "3002", source: +caddy}
    - {proto: tcp, dport: "3002", source: n8n}
    - {proto: udp, dport: "51820"}
  175:  # ollama
    - {proto: tcp, dport: "11434", source: +caddy}
    - {proto: tcp, dport: "11434", source: firecrawl}
    - {proto: tcp, dport: "11434", source: +nb_routers}
    - {proto: tcp, dport: "11434", source: n8n}
  172:  # prometheus (9090: Grafana query + Alloy CT166 remote_write)
    - {proto: tcp, dport: "9090", source: grafana}
    - {proto: tcp, dport: "9090", source: "10.10.0.66", comment: "Alloy remote_write"}
  173:  # loki (push from Alloy agents; 9095 gRPC stays Grafana-only)
    - {proto: tcp, dport: "3100", source: grafana}
    - {proto: tcp, dport: "9095", source: grafana}
    - {proto: tcp, dport: "3100", source: +log_shippers, comment: "Alloy push"}
    - {proto: tcp, dport: "12345", source: prometheus, comment: "alloy /metrics"}
    - {proto: udp, dport: "1514", source: flint, comment: "Flint remote syslog -> Alloy (wave 6)"}
  177:  # openobserve — UI via Caddy; Loki push from Alloy; remote_write from Prometheus; 5081 closed; node_exporter 9100 for Prometheus
    - {proto: tcp, dport: "5080", source: +caddy}
    - {proto: tcp, dport: "5080", source: +log_shippers, comment: "Alloy loki push"}
    - {proto: tcp, dport: "5080", source: prometheus, comment: "remote_write"}
    - {proto: tcp, dport: "9100", source: prometheus, comment: "node_exporter scrape"}
    - {proto: tcp, dport: "12345", source: prometheus, comment: "alloy /metrics"}
  178:  # postgres (t927u/t928u Nov 16) — 5432 from OpenObserve .77, Grafana .71, and Seerr .83; exporters for Prometheus.
    - {proto: tcp, dport: "5432", source: openobserve, comment: "O2 meta store"}
    - {proto: tcp, dport: "5432", source: grafana, comment: "Grafana config db"}
    - {proto: tcp, dport: "5432", source: seerr, comment: "Seerr trial db"}
    - {proto: tcp, dport: "9187", source: prometheus, comment: "postgres_exporter"}
    - {proto: tcp, dport: "9100", source: prometheus, comment: "node_exporter scrape"}
  179:  # mariadb (t928u Nov 16) — 3306 only from Uptime Kuma .84; exporters for Prometheus. Not rolled out until CT179 exists.
    - {proto: tcp, dport: "3306", source: 10.10.0.84, comment: "Uptime Kuma db"}
    - {proto: tcp, dport: "9104", source: prometheus, comment: "mysqld_exporter"}
    - {proto: tcp, dport: "9100", source: prometheus, comment: "node_exporter scrape"}
  174:  # pve-exporter
    - {proto: tcp, dport: "9221", source: prometheus}
    - {proto: tcp, dport: "12345", source: prometheus, comment: "alloy /metrics"}
  180:  # jellyfin (NetBird peer; LAN stays open until a guest VLAN exists)
    # 8096 already includes prometheus .72 via 10.10.0.0/24. Do not tighten
    # to .72 only: LAN clients and Caddy .250/.251 would lose the UI.
    - {proto: tcp, dport: "8096", source: 10.10.0.0/24}
    - {proto: udp, dport: "7359", source: 10.10.0.0/24}
    - {proto: udp, dport: "1900", source: 10.10.0.0/24}
    - {proto: udp, dport: "51820"}
  181:  # metube
    - {proto: tcp, dport: "8081", source: +caddy}
  182:  # arr (docker DNAT inside the CT; bridge sees pre-DNAT dport)
    - {proto: tcp, dport: "4545,5001,6767,7878,8085,8686,8989,9117,9696", source: +caddy}
    - {proto: tcp, dport: "7878,8989", source: seerr}
    - {proto: tcp, dport: "12345", source: prometheus, comment: "alloy /metrics"}
    - {proto: tcp, dport: "9707,9708,9709,9710,9711", source: prometheus, comment: "exportarr /metrics"}
    - {proto: tcp, dport: "8080", source: prometheus, comment: "cadvisor /metrics"}
    - {proto: tcp, dport: "17871", source: prometheus, comment: "qbittorrent-exporter /metrics"}
  183:  # seerr
