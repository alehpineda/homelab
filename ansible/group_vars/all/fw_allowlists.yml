  166:  # gitlab — UI via Caddy .250 to http://.66:80; Alloy :12345 from Prometheus only.
    # Guest fw is not live on this CT yet; in-CT nft currently restricts :12345.
    - {proto: tcp, dport: "80", source: +caddy, comment: "gitlab via Caddy"}
    - {proto: tcp, dport: "12345", source: prometheus, comment: "alloy /metrics"}
  185:  # romm
    - {proto: tcp, dport: "80", source: +caddy}
  186:  # navidrome
    - {proto: tcp, dport: "4533", source: +caddy}
    - {proto: tcp, dport: "4533", source: prometheus, comment: "navidrome /metrics"}
  187:  # audiobookshelf
