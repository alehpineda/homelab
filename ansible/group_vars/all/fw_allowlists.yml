    - {proto: tcp, dport: "12345", source: prometheus, comment: "alloy /metrics"}
    - {proto: tcp, dport: "3001", source: prometheus, comment: "kuma /metrics"}
  157:  # files (copyparty pilot, 2026-11-17) — UI only via Caddy eth0 .250; no NetBird, no LAN direct, not .251
