# TEMP one-off pgloader from CT176 (10.10.0.76) to CT178:5432 during the
# Seerr trial. Default OFF: merging this file, or applying the firewall
# playbook with the default, does not open 5432 to .76. Set this true only
# for that run (and re-apply pve-guest-firewall.yml for 178), then set
# false and re-apply. The postgresql role uses the same variable for pg_hba.
postgres_pgloader_temp_allow: false

# Extra IN rules, appended only when postgres_pgloader_temp_allow is true.
# See roles/pve_guest_firewall/tasks/guest.yml.
pve_fw_ct_rules_optional:
  178:
    - {proto: tcp, dport: "5432", source: 10.10.0.76/32, comment: "TEMP one-off pgloader from CT176; gated by postgres_pgloader_temp_allow"}

