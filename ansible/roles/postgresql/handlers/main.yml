---
- name: Restart postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    state: restarted

- name: Reload postgresql
  ansible.builtin.systemd_service:
    name: postgresql
    state: reloaded

- name: Restart postgres exporter
  ansible.builtin.systemd_service:
    name: prometheus-postgres-exporter
    state: restarted
