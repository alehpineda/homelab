# 2026-11-10: Caddy binds 10.10.0.250 and 10.10.0.251. On CT boot those
# addresses can arrive after caddy.service starts, so listen fails with
# "bind: cannot assign requested address" and the unit stays failed.
# The main unit already Wants/After network-online.target, but this guest
# has no wait-online provider (ifupdown2 networking.service does not
# order Before=network-online.target). Restart=on-failure is the fix.
[Unit]
Wants=network-online.target
After=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=3s
