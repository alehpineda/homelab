---
# CT 182. Paths inside the guest. This role does not create the host
# media user, the subuid entry, or the pct idmap and tun lines. It does
# not create the phase 2 media mountpoints.
arr_expected_hostname: arr-blr-lxc
arr_lan_address: 10.10.0.82
arr_stack_dir: /opt/stacks/arr
arr_env_file: /opt/stacks/arr/.env
arr_env_example: /opt/stacks/arr/.env.example
arr_compose_file: /opt/stacks/arr/compose.yaml
arr_dockge_dir: /opt/stacks/dockge
arr_dockge_compose: /opt/stacks/dockge/compose.yaml
arr_dockge_data: /opt/dockge/data
arr_gluetun_state: /opt/arr/gluetun
arr_qbit_config: /opt/arr/qbittorrent
arr_prowlarr_config: /opt/arr/prowlarr
arr_sonarr_config: /opt/arr/sonarr
arr_radarr_config: /opt/arr/radarr
arr_lidarr_config: /opt/arr/lidarr
arr_bazarr_config: /opt/arr/bazarr
arr_media_mount: /data/media
arr_downloads_mount: /data/downloads
arr_usenet_mount: /data/usenet
# Child binds already declared on the guest. Missing one must fail the
# play. Docker would otherwise create a local directory at the source.
arr_phase2_mounts:
  - /data/media/movies
  - /data/media/tv
  - /data/media/music
  - /data/downloads/movies
  - /data/downloads/tv
  - /data/downloads/music
  - /data/usenet/complete/movies
  - /data/usenet/complete/tv
  - /data/usenet/complete/music
arr_tun_device: /dev/net/tun
arr_env_check_script: /usr/local/lib/arr/check-env-names.py
arr_required_env_names:
  - VPN_SERVICE_PROVIDER
  - VPN_TYPE
  - WIREGUARD_PRIVATE_KEY
  - WATCHTOWER_NOTIFICATION_URL
arr_docker_packages:
  - docker.io
  - docker-compose-v2
