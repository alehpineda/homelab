# CT 182 arr stack. Phase 1 is gluetun, qBittorrent, and monitor-only
# Watchtower. Phase 2 adds Prowlarr, Sonarr, Radarr, Lidarr, Bazarr, and
# FlareSolverr on gluetun's network. Digests are the images that were
# running on bael, except Watchtower (containrrr/watchtower 1.7.1 amd64).
# pull_policy: missing means a re-run does not move off these digests.
# A pin change pulls because the new digest is not local.
# Listenarr (2026-11-10) joins gluetun's network on 4545; it imports
# audiobooks by COPY into /data/media/audiobooks (CT182 mp21 leaf bind).
# Recyclarr 8.8.1 (2026-11-13) joins that network with no published port.
# It syncs TRaSH custom formats to Sonarr and Radarr on localhost.
# Jackett (2026-11-13) joins that network on 9117.
# Recreate the VPN namespace without upgrading, from /opt/stacks/arr.
# Watchtower is not on that network and stays up:
#   docker compose up -d --force-recreate \
#     gluetun qbittorrent prowlarr sonarr radarr lidarr bazarr flaresolverr listenarr recyclarr \
#     jackett
# Do not run `docker compose config` against a populated .env.
# FlareSolverr listens on 8191 inside the gluetun namespace. That port
# is not published and is not in FIREWALL_INPUT_PORTS.

services:
  gluetun:
    image: qmcgaw/gluetun@sha256:44a82caf5b866193bfdfe8ffffbb11b20ce8138a917466c2c9bff9a52861c1a5
    pull_policy: missing
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "10.10.0.82:8085:8085/tcp"
      - "10.10.0.82:9696:9696/tcp"
      - "10.10.0.82:8989:8989/tcp"
      - "10.10.0.82:7878:7878/tcp"
      - "10.10.0.82:8686:8686/tcp"
      - "10.10.0.82:6767:6767/tcp"
      - "10.10.0.82:4545:4545/tcp"
      - "10.10.0.82:9117:9117/tcp"
    env_file:
      - /opt/stacks/arr/.env
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?set VPN_SERVICE_PROVIDER in /opt/stacks/arr/.env}
      VPN_TYPE: ${VPN_TYPE:?set VPN_TYPE in /opt/stacks/arr/.env}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set WIREGUARD_PRIVATE_KEY in /opt/stacks/arr/.env}
      # Overrides env_file. 8085 qBittorrent, 9696 Prowlarr, 8989 Sonarr,
      # 7878 Radarr, 8686 Lidarr, 6767 Bazarr, 4545 Listenarr, 9117 Jackett.
      # Not 8191.
      FIREWALL_INPUT_PORTS: "8085,9696,8989,7878,8686,6767,4545,9117"
    volumes:
      - /opt/arr/gluetun:/gluetun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.lo.disable_ipv6: "1"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
    pull_policy: missing
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/Chicago}
      WEBUI_PORT: "8085"
    volumes:
      - /opt/arr/qbittorrent:/config
      - /data/downloads:/data/downloads
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    pull_policy: missing
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      PROWLARR__LOG__CONSOLEFORMAT: Clef
    volumes:
      - /opt/arr/prowlarr:/config
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
    pull_policy: missing
    container_name: sonarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    volumes:
      - /opt/arr/sonarr:/config
      - /data/media/tv:/data/media/tv
      - /data/media/anime-tv:/data/media/anime-tv
      - /data/downloads/tv:/data/downloads/tv
      - /data/usenet/complete/tv:/data/usenet/complete/tv
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  radarr:
    image: lscr.io/linuxserver/radarr@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    pull_policy: missing
    container_name: radarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    volumes:
      - /opt/arr/radarr:/config
      - /data/media/movies:/data/media/movies
      - /data/media/anime-movies:/data/media/anime-movies
      - /data/downloads/movies:/data/downloads/movies
      - /data/usenet/complete/movies:/data/usenet/complete/movies
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  lidarr:
    image: lscr.io/linuxserver/lidarr@sha256:d5707cfe084da21a3864c7ef0edd9c0543b5e26c79c551f84dad5ef8683af8c7
    pull_policy: missing
    container_name: lidarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    volumes:
      - /opt/arr/lidarr:/config
      - /data/media/music:/data/media/music
      - /data/downloads/music:/data/downloads/music
      - /data/usenet/complete/music:/data/usenet/complete/music
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  bazarr:
    image: lscr.io/linuxserver/bazarr@sha256:7ef0e58216900dbce30b123e0eb65f5cb30e36f126de9474acdd2022fb069c54
    pull_policy: missing
    container_name: bazarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
    volumes:
      - /opt/arr/bazarr:/config
      - /data/media/movies:/data/media/movies
      - /data/media/anime-movies:/data/media/anime-movies
      - /data/media/tv:/data/media/tv
      - /data/media/anime-tv:/data/media/anime-tv
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  listenarr:
    # ghcr.io/listenarrs/listenarr canary-1.6.3 linux/amd64 (upstream: beta).
    # Index digest sha256:265d4fd8f8242079a6620257dda018d022f053fa7f1d512c5dcbc5c880c3e85d
    # Entrypoint remaps its listenarr user to PUID/PGID and drops via gosu.
    # Admin .250 only (listenarr.alehpineda.com). Import mode: copy.
    image: ghcr.io/listenarrs/listenarr@sha256:076c989b4cdee4fad5b0b1b776e0e9877b8d9957cf81d9eef96053a07df2f547
    pull_policy: missing
    container_name: listenarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
      TZ: America/Chicago
      LISTENARR_PUBLIC_URL: https://listenarr.alehpineda.com
    volumes:
      - /opt/arr/listenarr:/app/config
      - /data/media/audiobooks:/data/media/audiobooks
      - /data/downloads/books:/data/downloads/books
      - /data/usenet/complete/books:/data/usenet/complete/books
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  recyclarr:
    # ghcr.io/recyclarr/recyclarr:8.8.1 linux/amd64.
    # Index digest sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    # Image USER is 1000:1000. The entrypoint does not honor PUID/PGID.
    # No listener. Sonarr is localhost:8989 and Radarr is localhost:7878.
    image: ghcr.io/recyclarr/recyclarr@sha256:1a8370c4e830ee3b46709225cc888013e20f667c6bc87593fd58ecfbf149afbf
    pull_policy: missing
    container_name: recyclarr
    user: "1000:1000"
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: America/Chicago
      CRON_SCHEDULE: "0 4 * * *"
    volumes:
      - /opt/arr/recyclarr:/config
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  jackett:
    # lscr.io/linuxserver/jackett v0.24.3055-ls35 linux/amd64.
    # Index digest sha256:19802345fcc60a536802d29f36db073a77193fcd2f8fe3d067f604fc60a77352
    # UI and Torznab on 9117. FlareSolverr is localhost:8191 in this namespace.
    image: lscr.io/linuxserver/jackett@sha256:97cfc479a4f6fe54787651bb496e76cb40c5b139d70e36b5999b4e0fccdcf60e
    pull_policy: missing
    container_name: jackett
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      AUTO_UPDATE: "false"
    volumes:
      - /opt/arr/jackett:/config
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  flaresolverr:
    # Not a LinuxServer image. The process already runs as uid 1000.
    # PUID and PGID do not change that, so they are not set here.
    # No /config bind: the source volume had no durable database.
    image: flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    pull_policy: missing
    container_name: flaresolverr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: America/Chicago
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "true"
    security_opt:
      - no-new-privileges:true

  watchtower:
    # nickfedor/watchtower 1.24.0 amd64 (maintained fork of archived containrrr).
    # Platform digest sha256:7f7ed5b9239c9dc6f97fc54666bedca85688e8e5cc4e2b3b2aaa41953af1f011
    # Multi-arch index for tag 1.24.0: sha256:e96976bcbeaf0a9adeddc9016a539c27a2245ef6bb7d3ca97ed106783350d387
    # No command arguments: monitors every running container on this daemon.
    # No WATCHTOWER_LABEL_ENABLE and no WATCHTOWER_SCOPE. Phase 2 services still
    # set enable and monitor-only labels. LABEL_TAKE_PRECEDENCE is false,
    # so those labels cannot turn updates on. MONITOR_ONLY is hardcoded.
    # A value in .env cannot turn updates on. The socket is read-only.
    image: nickfedor/watchtower@sha256:7f7ed5b9239c9dc6f97fc54666bedca85688e8e5cc4e2b3b2aaa41953af1f011
    pull_policy: missing
    container_name: watchtower
    environment:
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_LABEL_TAKE_PRECEDENCE: "false"
      WATCHTOWER_SCHEDULE: "0 0 6 * * *"
      TZ: America/Chicago
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: arr-blr-lxc
      # Fork autonegotiates Docker API; keep 1.44 pinned for Docker 29 parity
      # with the prior containrrr pin (avoids old-client defaults).
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:?set WATCHTOWER_NOTIFICATION_URL in /opt/stacks/arr/.env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
