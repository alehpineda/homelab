---
# Non-root editor access to dashboard config files (CT 191 Homepage,
# CT 198 Homer). Wolff (observability bot) edits tiles as grokops from
# CT 176. No sudo, no password login. See docs/runbooks/dashboard-editor.md.
dashboard_editor_user: grokops
dashboard_editor_group: dashcfg

# Public keys only. Set them in the gitignored inventory/blr.yml (host or
# group vars), same as pbs_grokops_pubkeys. The live key is the CT 176
# forge key, fingerprint SHA256:B0BznGN4uG7ub8EpB9qyE62MzZfygeGqgZA6gWIgC1s.
dashboard_editor_pubkeys: []

# Set per host: the config files the editor may change. Their parent
# directories also get group write (setgid) so atomic-rename editors work.
# Prefer this list. The legacy singular dashboard_editor_config_file is
# still accepted when the list is empty.
# dashboard_editor_config_files:
#   - /opt/homepage/config/services.yaml
#   - /opt/homepage/config/settings.yaml
#   - /opt/homepage/config/widgets.yaml
#   - /opt/homepage/config/bookmarks.yaml
#   - /opt/homepage/config/proxmox.yaml
dashboard_editor_config_files: []
# dashboard_editor_config_file: /opt/homepage/config/services.yaml
