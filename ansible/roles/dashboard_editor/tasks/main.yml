---
# Idempotent. grokops authorized_keys is rendered in full by role
# bot_ssh_keys (target dashboard). Keeps root as
# owner of the config files and directories; only the group and g+w change.
# No service restart: Homepage hot-reloads these YAML files.

- name: Normalize the config file list
  ansible.builtin.set_fact:
    dashboard_editor_files: "{{ dashboard_editor_config_files if (dashboard_editor_config_files | default([]) | length > 0) else ([dashboard_editor_config_file] if dashboard_editor_config_file is defined else []) }}"

- name: Require at least one config file path
  ansible.builtin.assert:
    that:
      - dashboard_editor_files | length > 0
    fail_msg: >-
      Set dashboard_editor_config_files (or the legacy
      dashboard_editor_config_file) per host in the gitignored
      inventory/blr.yml.

- name: Refuse the retired key list
  ansible.builtin.assert:
    that: dashboard_editor_pubkeys is not defined
    fail_msg: >-
      dashboard_editor_pubkeys is retired. Keys come from
      group_vars/all/bot_ssh_keys.yml (role bot_ssh_keys, target dashboard).

- name: Check each config file exists
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ dashboard_editor_files }}"
  register: dashboard_editor_cfg

- name: Require the existing config files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "{{ item.item }} is missing. This role does not install the dashboard."
  loop: "{{ dashboard_editor_cfg.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create the editor group
  ansible.builtin.group:
    name: "{{ dashboard_editor_group }}"
    system: true

- name: Create the editor user (no sudo group, locked password)
  ansible.builtin.user:
    name: "{{ dashboard_editor_user }}"
    shell: /bin/bash
    create_home: true
    groups: ["{{ dashboard_editor_group }}"]
    append: true
    password_lock: true

- name: Create the editor .ssh directory
  ansible.builtin.file:
    path: "/home/{{ dashboard_editor_user }}/.ssh"
    state: directory
    owner: "{{ dashboard_editor_user }}"
    group: "{{ dashboard_editor_user }}"
    mode: "0700"

- name: Authorize per-bot keys (exclusive, role bot_ssh_keys)
  ansible.builtin.include_role:
    name: bot_ssh_keys
  vars:
    bot_ssh_keys_target: dashboard
    bot_ssh_keys_accounts: ["{{ dashboard_editor_user }}"]

- name: Group-write each config directory (setgid so new files keep the group)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ dashboard_editor_group }}"
    mode: "2775"
  loop: "{{ dashboard_editor_files | map('dirname') | unique | list }}"

- name: Group-write each config file
  ansible.builtin.file:
    path: "{{ item }}"
    state: file
    owner: root
    group: "{{ dashboard_editor_group }}"
    mode: "0664"
  loop: "{{ dashboard_editor_files }}"
