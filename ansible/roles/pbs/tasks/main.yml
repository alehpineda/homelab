---
- name: Restrict this role to the PBS host
  ansible.builtin.assert:
    that:
      - ansible_facts.hostname == pbs_expected_hostname
    fail_msg: This role is only approved for {{ pbs_expected_hostname }}.

- name: Import repository tasks
  ansible.builtin.import_tasks: repos.yml

- name: Import service account tasks
  ansible.builtin.import_tasks: users.yml

- name: Import datastore and job tasks
  ansible.builtin.import_tasks: datastore.yml

- name: Import PVE backup identity tasks
  ansible.builtin.import_tasks: pve_identity.yml

- name: Import unattended security upgrade tasks
  ansible.builtin.import_tasks: unattended.yml
  when: pbs_unattended_upgrades

- name: Import host backup tasks
  ansible.builtin.import_tasks: host_backups.yml
  when: pbs_host_backups

- name: Import mail relay tasks
  ansible.builtin.import_tasks: mail_relay.yml
  when: pbs_mail_relay
