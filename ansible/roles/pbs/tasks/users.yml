---
- name: Create service accounts
  ansible.builtin.user:
    name: "{{ item }}"
    shell: /bin/bash
    create_home: true
  loop: [grokaudit, grokops]

- name: Create .ssh directories
  ansible.builtin.file:
    path: "/home/{{ item }}/.ssh"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: [grokaudit, grokops]

- name: Refuse the retired per-account key lists
  ansible.builtin.assert:
    that:
      - pbs_grokaudit_pubkeys is not defined
      - pbs_grokops_pubkeys is not defined
    fail_msg: >-
      pbs_grokaudit_pubkeys / pbs_grokops_pubkeys are retired. Keys come
      from group_vars/all/bot_ssh_keys.yml; put any non-bot line in
      bot_ssh_keys_extra (host_vars).

- name: Authorize per-bot keys (exclusive, role bot_ssh_keys)
  ansible.builtin.include_role:
    name: bot_ssh_keys
  vars:
    bot_ssh_keys_target: pbs
    bot_ssh_keys_accounts: [grokaudit, grokops]

- name: Least-privilege sudo for grokops
  ansible.builtin.template:
    src: grokops-pbs.sudoers.j2
    dest: /etc/sudoers.d/grokops-pbs
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
