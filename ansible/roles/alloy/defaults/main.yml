---
# Grafana Alloy log agent. One per source host. Every source fans out the
# same entries to Loki CT 173 and OpenObserve CT 177 (Loki push API).
alloy_version: "1.21.3-1"
alloy_apt_key_url: https://apt.grafana.com/gpg.key
# Grafana Labs <engineering@grafana.com>, expires 2027-08-22.
alloy_apt_key_fingerprint: B53AE77BADB630A683046005963FA27710458545  # gitleaks:allow (public GPG fingerprint)
alloy_apt_repo_uri: https://apt.grafana.com

alloy_loki_push_url: http://10.10.0.73:3100/loki/api/v1/push
alloy_o2_push_url: http://10.10.0.77:5080/api/default/loki/api/v1/push
# Controller-side secret file (KEY=VALUE, 0600): O2_USER_EMAIL / O2_USER_PASSWORD.
alloy_o2_ingest_secret_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/forge/openobserve_ingest"
alloy_o2_env_file: /etc/alloy/o2.env

# Low-cardinality `host` label on every entry.
alloy_host_label: "{{ inventory_hostname }}"

# Sources. Set per host in the playbook (never all at once by default).
alloy_source_journal: false     # BRL host journald -> job pve_journal
alloy_source_caddy: false       # CT 250 /var/log/caddy/access.log -> job caddy_access
alloy_source_docker: false      # CT 182 Docker stdout -> job arr_docker
alloy_source_adguard: false     # CT 153 querylog.json -> job adguard_query (phase 1b)

alloy_journal_max_age: 12h
alloy_caddy_log_dir: /var/log/caddy
alloy_caddy_log_file: /var/log/caddy/access.log
alloy_docker_socket: unix:///var/run/docker.sock
alloy_adguard_querylog: /opt/AdGuardHome/data/querylog.json
