---
# Grafana Alloy log agent. One per source host. Every source fans out the
# same entries to Loki CT 173 and OpenObserve CT 177 (Loki push API).
alloy_version: "1.21.3-1"
alloy_apt_key_url: https://apt.grafana.com/gpg.key
# Grafana Labs <engineering@grafana.com>, expires 2027-08-22.
alloy_apt_key_fingerprint: B53AE77BADB630A683046005963FA27710458545  # gitleaks:allow (public GPG fingerprint)
alloy_apt_repo_uri: https://apt.grafana.com
# Hosts that already install packages from apt.grafana.com (CT171 grafana,
# CT173 loki via the community-scripts deb822 source + grafana.gpg): keep
# their grafana.sources and key, verify that key's fingerprint, and do NOT
# add the "Package: * Pin-Priority -1" block (it would freeze grafana/loki
# upgrades). Found 2026-11-14 on CT171 (rolled back).
alloy_apt_existing_grafana_repo: false
alloy_apt_existing_key: /etc/apt/keyrings/grafana.gpg

alloy_loki_push_url: http://10.10.0.73:3100/loki/api/v1/push
alloy_o2_push_url: http://10.10.0.77:5080/api/default/loki/api/v1/push
# Controller-side secret file (KEY=VALUE, 0600): O2_USER_EMAIL / O2_USER_PASSWORD.
alloy_o2_ingest_secret_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/forge/openobserve_ingest"
alloy_o2_env_file: /etc/alloy/o2.env

# Low-cardinality `host` label on every entry.
alloy_host_label: "{{ inventory_hostname }}"
# `env` stream label, added by the caddy and journal JSON pipelines.
alloy_env_label: homelab

# Sources. Set per host in the playbook (never all at once by default).
alloy_source_journal: false     # journald -> job {{ alloy_journal_job }} (BRL: pve_journal)
alloy_source_caddy: false       # CT 250 /var/log/caddy/access.log -> job caddy_access
alloy_source_docker: false      # CT 182 Docker stdout -> job arr_docker
alloy_source_adguard: false     # CT 153/155 querylog.json -> job adguard_querylog
alloy_source_qbittorrent: false # CT 182 qBittorrent log file -> job arr_qbittorrent

alloy_journal_max_age: 12h
# Alloy HTTP server (UI + /metrics). Empty = package default 127.0.0.1:12345.
# Metrics wave 1 sets "<LAN IP>:12345" per host so Prometheus CT172 can scrape
# it (PVE guest fw allows tcp/12345 from alias prometheus only).
alloy_http_listen_addr: ""
# Standard for every old and new service (owner, 2026-11-14 1:54 PM CT):
# JSON logs by default. Each entry ships as one JSON object
#   {ts, level, service, host, env, [component], msg}
# (journal: + unit; Caddy and Servarr CLEF keep their native JSON), with
# stream labels limited to job, host, env=homelab and, on CTs, ct + service.
# A new host's play sets alloy_journal_job (<service>_journal),
# alloy_service_label (<service>) and alloy_ct_label ("<ctid>"); a Docker
# host lists its text-console containers in alloy_docker_json_containers.
# Prefer the app's native JSON console when it has one. High-cardinality
# values (client IP, query name, URI, user/trace ids) stay in the body.
# Journal pipeline identity (one template for BRL and every CT).
# Job name for loki.source.journal (and the OpenObserve o2_stream_name).
alloy_journal_job: pve_journal
# JSON body "service" field; also a stream label when alloy_ct_label is set.
alloy_service_label: "{{ alloy_journal_job }}"
# CT id as a string stream label. Empty (BRL host) = no ct/service stream
# labels, so the live pve_journal stream identity stays unchanged.
alloy_ct_label: ""
# Host-level sources with no ct (wave 6 PBS): still stamp the service stream
# label. BRL keeps false, so its render stays byte-identical.
alloy_journal_service_stream_label: false
# Optional per-host journal drop filters, applied to MESSAGE (the "msg"
# field) before the JSON line is built, so both Loki and OpenObserve lose
# the same lines. List of {expression: RE2 regex, reason: drop_counter_reason,
# comment: optional}. Empty = rendered config unchanged.
alloy_journal_drop_rules: []
alloy_caddy_log_dir: /var/log/caddy
alloy_caddy_log_file: /var/log/caddy/access.log
alloy_docker_socket: unix:///var/run/docker.sock
# arr_docker JSON pack (CT 182). Containers whose text console lines are
# parsed into the standard body {ts, level, service, host, env, [component],
# msg}; known formats: bazarr, jackett, flaresolverr, gluetun, recyclarr,
# watchtower, listenarr. Empty = arr_docker lines pass through unchanged.
alloy_docker_json_containers: []
# CLEF containers (Servarr): JSON lines untouched, only the non-JSON lines
# (linuxserver/s6 banner, NLog text) are packed as level info.
alloy_docker_banner_containers: []
# Zone of container wall-clock timestamps that carry no offset (TZ in compose).
alloy_docker_local_tz: America/Chicago
# AdGuard querylog (CT 153/155). AdGuard keeps data/ 0700 and files 0600 and
# its startup permcheck chmods them back, which zeroes any ACL mask. With
# alloy_source_adguard the role installs `acl`, grants the alloy user read
# (data dir: r-x + default ACL; querylog.json and .1: r--) and a root timer
# (alloy-adguard-acl.timer) re-applies those ACL entries and masks every
# alloy_adguard_acl_interval. Alloy itself never runs as root.
alloy_adguard_data_dir: /opt/AdGuardHome/data
alloy_adguard_querylog: "{{ alloy_adguard_data_dir }}/querylog.json"
alloy_adguard_acl_interval: 2min
# qBittorrent log file (CT 182, linuxserver image, /config = /opt/arr/qbittorrent).
# The file is 0600 uid 1000 under /opt/arr (0700 root) and qBittorrent
# recreates it at every rotation, so with alloy_source_qbittorrent the
# role installs `acl` and a root path unit + timer (alloy-qbittorrent-acl)
# that grant the alloy user traverse (x) on the parent dirs and read on the
# active log only. No qBittorrent setting or file content is changed.
alloy_qbittorrent_config_dir: /opt/arr/qbittorrent
alloy_qbittorrent_log_dir: "{{ alloy_qbittorrent_config_dir }}/qBittorrent/logs"
alloy_qbittorrent_log: "{{ alloy_qbittorrent_log_dir }}/qbittorrent.log"
alloy_qbittorrent_acl_interval: 2min

# Remote syslog listener (wave 6, CT 173): one listener per device, e.g.
#   - {address: "10.10.0.73:1514", protocol: udp, format: rfc3164,
#      job: flint_syslog, host: flint, service: flint}
# Open the port in fw_allowlists (CT rule) and the in-guest nft for the
# device IP only.
alloy_source_syslog: false
alloy_syslog_listeners: []
alloy_syslog_drop_rules: []
