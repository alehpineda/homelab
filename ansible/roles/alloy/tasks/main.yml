---
# Installs Grafana Alloy (pinned + held) and renders a per-host config.
# Does not edit the Caddyfile, Docker, or journald.

- name: Read OpenObserve ingest credentials from the controller secret file
  ansible.builtin.set_fact:
    _alloy_o2_user: "{{ lookup('ansible.builtin.ini', 'O2_USER_EMAIL', type='properties', file=alloy_o2_ingest_secret_file) }}"
    _alloy_o2_password: "{{ lookup('ansible.builtin.ini', 'O2_USER_PASSWORD', type='properties', file=alloy_o2_ingest_secret_file) }}"
  no_log: true

- name: Ensure gnupg (needed for the key fingerprint check; minimal CTs lack it)
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Pick the Grafana key file to verify
  ansible.builtin.set_fact:
    _alloy_key_file: "{{ alloy_apt_existing_key if alloy_apt_existing_grafana_repo else '/etc/apt/keyrings/grafana.asc' }}"

- name: Fetch the Grafana apt key
  ansible.builtin.get_url:
    url: "{{ alloy_apt_key_url }}"
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"
  when: not alloy_apt_existing_grafana_repo

- name: Verify the Grafana apt key fingerprint
  ansible.builtin.command:
    argv: [gpg, --show-keys, --with-colons, "{{ _alloy_key_file }}"]
  register: _alloy_key
  changed_when: false

- name: Fail on an unexpected key
  ansible.builtin.assert:
    that:
      - ("fpr:::::::::" ~ alloy_apt_key_fingerprint ~ ":") in _alloy_key.stdout
    fail_msg: "{{ _alloy_key_file }} fingerprint does not match {{ alloy_apt_key_fingerprint }}."

- name: Add the Grafana apt source (Alloy only is installed from it)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ alloy_apt_repo_uri }}
      Suites: stable
      Components: main
      Signed-By: /etc/apt/keyrings/grafana.asc
  when: not alloy_apt_existing_grafana_repo
  register: _alloy_src

- name: Pin alloy to alloy_version (first matching pin wins, so it must be a version pin)
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/grafana-alloy-only
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: alloy
      Pin: version {{ alloy_version }}
      Pin-Priority: 1001
      {% if not alloy_apt_existing_grafana_repo %}

      Package: *
      Pin: origin "apt.grafana.com"
      Pin-Priority: -1
      {% endif %}
  register: _alloy_pin

- name: Refresh apt after the Grafana source or pin changed
  ansible.builtin.apt:
    update_cache: true
  when: (_alloy_src is changed) or (_alloy_pin is changed)

- name: Install the pinned alloy package
  ansible.builtin.apt:
    name: "alloy={{ alloy_version }}"
    update_cache: true
    allow_downgrade: false

- name: Hold alloy
  ansible.builtin.dpkg_selections:
    name: alloy
    selection: hold

- name: Let alloy read the journal
  ansible.builtin.user:
    name: alloy
    groups: [systemd-journal, adm]
    append: true
  when: alloy_source_journal
  notify: Restart alloy

- name: Ensure the Caddy log directory (group-readable for alloy)
  ansible.builtin.file:
    path: "{{ alloy_caddy_log_dir }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"
  when: alloy_source_caddy

- name: Let alloy read Caddy logs
  ansible.builtin.user:
    name: alloy
    groups: [caddy]
    append: true
  when: alloy_source_caddy
  notify: Restart alloy

- name: Let alloy read the Docker socket (root-equivalent inside this CT only)
  ansible.builtin.user:
    name: alloy
    groups: [docker]
    append: true
  when: alloy_source_docker
  notify: Restart alloy

- name: Ensure acl (setfacl) for the AdGuard querylog read grant
  ansible.builtin.apt:
    name: acl
    state: present
  when: alloy_source_adguard

- name: Install the AdGuard querylog ACL re-apply script
  ansible.builtin.template:
    src: alloy-adguard-acl.sh.j2
    dest: /usr/local/sbin/alloy-adguard-acl
    owner: root
    group: root
    mode: "0755"
  when: alloy_source_adguard

- name: Install the AdGuard querylog ACL service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [alloy-adguard-acl.service, alloy-adguard-acl.timer]
  when: alloy_source_adguard

- name: Apply the AdGuard querylog ACL now
  ansible.builtin.systemd_service:
    name: alloy-adguard-acl.service
    state: started
    daemon_reload: true
  changed_when: false
  when: alloy_source_adguard

- name: Enable the AdGuard querylog ACL timer
  ansible.builtin.systemd_service:
    name: alloy-adguard-acl.timer
    state: started
    enabled: true
    daemon_reload: true
  when: alloy_source_adguard

- name: Ensure acl (setfacl) for the qBittorrent log read grant
  ansible.builtin.apt:
    name: acl
    state: present
  when: alloy_source_qbittorrent

- name: Install the qBittorrent log ACL re-apply script
  ansible.builtin.template:
    src: alloy-qbittorrent-acl.sh.j2
    dest: /usr/local/sbin/alloy-qbittorrent-acl
    owner: root
    group: root
    mode: "0755"
  when: alloy_source_qbittorrent

- name: Install the qBittorrent log ACL service, path unit and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [alloy-qbittorrent-acl.service, alloy-qbittorrent-acl.path, alloy-qbittorrent-acl.timer]
  when: alloy_source_qbittorrent

- name: Apply the qBittorrent log ACL now
  ansible.builtin.systemd_service:
    name: alloy-qbittorrent-acl.service
    state: started
    daemon_reload: true
  changed_when: false
  when: alloy_source_qbittorrent

- name: Enable the qBittorrent log ACL path unit and timer
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: [alloy-qbittorrent-acl.path, alloy-qbittorrent-acl.timer]
  when: alloy_source_qbittorrent

- name: Ensure acl (setfacl) for the GitLab log read grant
  ansible.builtin.apt:
    name: acl
    state: present
  when: alloy_source_gitlab

- name: Install the GitLab log ACL re-apply script
  ansible.builtin.template:
    src: alloy-gitlab-acl.sh.j2
    dest: /usr/local/sbin/alloy-gitlab-acl
    owner: root
    group: root
    mode: "0755"
  when: alloy_source_gitlab

- name: Install the GitLab log ACL service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [alloy-gitlab-acl.service, alloy-gitlab-acl.timer]
  when: alloy_source_gitlab

- name: Apply the GitLab log ACL now
  ansible.builtin.systemd_service:
    name: alloy-gitlab-acl.service
    state: started
    daemon_reload: true
  changed_when: false
  when: alloy_source_gitlab

- name: Enable the GitLab log ACL timer
  ansible.builtin.systemd_service:
    name: alloy-gitlab-acl.timer
    state: started
    enabled: true
    daemon_reload: true
  when: alloy_source_gitlab

- name: Write the OpenObserve ingest env file (0600)
  ansible.builtin.template:
    src: o2.env.j2
    dest: "{{ alloy_o2_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart alloy

- name: Ensure the alloy unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/alloy.service.d
    state: directory
    mode: "0755"

- name: Add the OpenObserve env drop-in
  ansible.builtin.template:
    src: 10-forge-o2.conf.j2
    dest: /etc/systemd/system/alloy.service.d/10-forge-o2.conf
    mode: "0644"
  notify: Restart alloy

- name: Alloy HTTP listen address (scraped by Prometheus CT172)
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--server.http.listen-addr={{ alloy_http_listen_addr }}"'
    backup: true
  when: alloy_http_listen_addr | length > 0
  notify: Restart alloy

- name: Render config.alloy (validated with alloy fmt)
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
    backup: true
    validate: /usr/bin/alloy fmt %s
  notify: Restart alloy

- name: Enable and start alloy
  ansible.builtin.systemd_service:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
