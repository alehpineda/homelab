---
# Guest path of CT 175 mp0. The host path is /media/ollama-models
# (ZFS dataset media/ollama-models). This role does not create that dataset.
ollama_models_dir: /mnt/ollama-models

# Official installer on CT 175, 2026-11-06 (was community-script 0.35.1).
# This role does not install or upgrade Ollama. The models directory
# stays root:root and is not recursed. Override owner or group in the
# gitignored inventory if the unit User= is not root.
ollama_version: "0.40.15"
ollama_service_name: ollama
ollama_unit_path: /etc/systemd/system/ollama.service
ollama_dropin_dir: /etc/systemd/system/ollama.service.d
ollama_dropin_filename: models.conf
ollama_models_owner: root
ollama_models_group: root
ollama_models_mode: "0755"
