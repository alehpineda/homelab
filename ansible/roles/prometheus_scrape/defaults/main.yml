---
# Repo-managed scrape jobs for Prometheus CT 172. Each job is one file in
# prometheus_scrape_dir, loaded through a marked top-level
# `scrape_config_files` block in prometheus.yml (validated with promtool).
# The hand-written scrape_configs in prometheus.yml stay as they are.
prometheus_config_path: /etc/prometheus/prometheus.yml
prometheus_promtool: /usr/local/bin/promtool
prometheus_scrape_dir: /etc/prometheus/scrape.d
# - job: name
#   static_configs: [{targets: ["ip:port"], labels: {k: v}}]
#   metrics_path: /metrics             (optional)
#   basic_auth: {username: "", password_file: /etc/prometheus/<job>.pass}  (optional)
#   bearer_token_file: /etc/prometheus/<job>_token                  (optional)
#   scheme: https                                                   (optional)
#   params: {format: [prometheus]}                                  (optional)
#   tls_config: {insecure_skip_verify: true}                        (optional)
#   scrape_interval / scrape_timeout: "60s"                         (optional)
#   metric_relabel_configs: [{...}]                                 (optional, Prometheus syntax)
prometheus_scrape_jobs: []
# Monthly auto-renew of the OpenBao metrics token on CT172. Off by default;
# enable from the prom_scrape play (prometheus_openbao_token_renew: true).
prometheus_openbao_token_renew: false
prometheus_openbao_token_file: /etc/prometheus/openbao_token
prometheus_openbao_renew_url: https://10.10.0.62:8200/v1/auth/token/renew-self
prometheus_openbao_renew_script: /usr/local/sbin/openbao-token-renew
prometheus_openbao_renew_randomized_delay: 30min

# Enable --web.enable-remote-write-receiver via a systemd drop-in that
# replaces ExecStart. Off by default; turn on from the prom_scrape play.
# Keep the ExecStart flags in the drop-in template in sync with the unit.
prometheus_enable_remote_write_receiver: false
prometheus_bin: /usr/local/bin/prometheus
prometheus_listen_address: 0.0.0.0:9090
prometheus_tsdb_path: /var/lib/prometheus/
prometheus_unit_dropin_dir: /etc/systemd/system/prometheus.service.d
