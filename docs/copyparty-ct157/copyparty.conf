# copyparty pilot on CT157 (files.alehpineda.com, LAN only via Caddy .250)
# Managed by Forge, 2026-11-17. Plan: plans/2026-11-17-copyparty-pilot.md
# Started 2026-11-17 18:10 CT after the owner snapshot @pre-copyparty-20261117.
[global]
  i: 10.10.0.57                    # bind eth0 only
  p: 3923
  rproxy: 1                        # Caddy sends one trustworthy client IP
  xff-hdr: x-forwarded-for
  xff-src: 10.10.0.250/32
  ah-alg: argon2
  hist: /var/lib/copyparty/hist    # db + thumbs on rootfs, never .hist in media
  e2dsa                            # filename/size index of all volumes
  no-hash: .                       # don't hash file contents (8 TB)
  no-robots
  force-js
  no-readme
  no-logues
  theme: 2
  lo: /var/log/copyparty/cpp-%Y-%m%d.txt.xz
  # ftp/sftp/smb/tftp/zeroconf stay off (default)

[accounts]
  deathscythe: +<ARGON2-HASH: generate with --ah-cli as user media; never commit>

# No [/] volume: the root is a virtual listing of the volumes below.
# No anonymous permissions anywhere. A = rwmda + dotfiles (owner yes: full
# rights including delete).
[/movies]
  /media/movies
  accs:
    A: deathscythe
[/tv]
  /media/tv
  accs:
    A: deathscythe
[/anime-tv]
  /media/anime-tv
  accs:
    A: deathscythe
[/anime-movies]
  /media/anime-movies
  accs:
    A: deathscythe
[/music]
  /media/music
  accs:
    A: deathscythe
[/audiobooks]
  /media/audiobooks
  accs:
    A: deathscythe
[/metube]
  /media/metube
  accs:
    r: deathscythe                 # bind is ro=1
