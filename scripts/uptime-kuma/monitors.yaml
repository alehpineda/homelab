# Uptime Kuma v1 inventory for CT184 (uptime.alehpineda.com).
# Source of truth for scripts/uptime-kuma/seed.py.
# No secrets in this file. Credentials and SMTP come from environment variables.
#
# Library pin: uptime-kuma-api2==2.10.0 (released 2026-11-09).
# Upstream tests the socket API through Uptime Kuma 2.5.0; 2.10.0 is the
# current release with runtime version gating. Login against this instance
# (2.5.9) is the live verification.
#
# 57 enabled monitors (44 v1 incl. CT185-190, plus 10 from the 2026-11-10
# ten-service raise, plus OpenObserve CT177 on 2026-11-11, plus CrowdSec
# Web UI on gremory on 2026-11-14, plus Jackett on CT182 on 2026-11-14;
# no LXC/router pings). The former CT185-190 placeholders were moved into
# monitors after the six services went live.

kuma:
  url: https://uptime.alehpineda.com
  expected_version: "2.5.9"

library:
  package: uptime-kuma-api2
  version: "2.10.0"

# Non-secret SMTP fields live here. SMTP_PASSWORD comes from the environment
# only (never in this file). Env vars still override host/port/from/to/user
# if set. apply_existing stays false; the seeder attaches by name via
# notificationIDList instead of Kuma's one-shot "Apply on all".
notification:
  name: Forge email (Gmail)
  type: smtp
  is_default: true
  apply_existing: false
  smtp_secure: false   # STARTTLS on 587; set true only for implicit TLS (465)
  smtp_host: smtp.gmail.com
  smtp_port: 587
  smtp_from: ale.hpineda@gmail.com
  smtp_to: deathscythe+kuma@mail.grokbot.com
  smtp_user: ale.hpineda@gmail.com
  smtp_password_env: SMTP_PASSWORD

tags:
  - {name: hosts,  color: "#c0392b"}
  - {name: admin,  color: "#2980b9"}
  - {name: family, color: "#27ae60"}
  - {name: public, color: "#8e44ad"}
  - {name: dns,    color: "#f39c12"}
  - {name: caddy,  color: "#16a085"}

# Admin-only page at https://uptime.alehpineda.com/status/homelab
# (the vhost is already Admin-Arr-DNS / .250; do not add a public or family name).
status_page:
  slug: homelab
  title: Homelab
  description: Admin-only status for the alehpineda homelab and public sites we own.
  published: true
  theme: auto
  show_tags: true
  show_powered_by: false
  show_certificate_expiry: true
  groups:
    - name: PVE / PBS / LAN hosts
      monitors:
        - BRL PVE ping
        - PBS ping
        - Flint ping
        - Comet ping
        - bael ping
    - name: Admin URLs
      monitors:
        - AdGuard UI
        - Grafana
        - OpenObserve
        - n8n UI
        - Postiz
        - Firecrawl
        - Ollama
        - OpenBao
        - Vaultwarden
        - MeTube
        - Dockge
        - Prowlarr
        - Sonarr
        - Radarr
        - Lidarr
        - Bazarr
        - qBittorrent
        - PBS UI
        - PVE UI
        - Comet UI
        - Uptime Kuma (Caddy canary)
        - Dispatcharr
        - NetBox
        - Wazuh
        - Homepage
        - Homarr
        - Homer
        - PriceBuddy
        - Change Detection
        - Semaphore
        - MyIP
        - Listenarr
        - Jackett
        - CrowdSec Web UI
    - name: Family URLs
      monitors:
        - Jellyfin
        - Seerr
        - SearXNG
        - RomM
        - Navidrome
        - Audiobookshelf
        - BentoPDF
        - Linkwarden
    - name: VPS / public
      monitors:
        - gremory ping
        - NetBird mgmt
        - mtgdrops.com
        - inspectorhacker.com
    - name: DNS
      monitors:
        - AdGuard A recurse
        - AdGuard B recurse
        - Rewrite admin
        - Rewrite family
    - name: NetBird / Caddy
      monitors:
        - Caddy admin VIP
        - Caddy family VIP

# Shared defaults. resend_interval is missed checks (Kuma resendInterval),
# not minutes: 60 critical (~60 min at a 60s interval), 120 for 180s apps
# (~6 h), 72 for 300s public (~6 h). timeout is seconds.
defaults:
  maxretries: 3
  maxredirects: 10
  ignore_tls: false
  accepted_statuscodes: ["200-299", "300-399"]
  retry_interval_equals: interval
  timeout: 15
  dns_timeout: 5
  resend_critical: 60
  resend_app: 120
  resend_public: 72

